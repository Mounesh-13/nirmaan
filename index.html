<script>
'use strict';

/* ═══════════ CONFIG — no localStorage, no sessionStorage, no disk writes ═══════════ */
const SUPABASE_URL     = 'https://vtyzkduicanxopotfcws.supabase.co';
const SUPABASE_ANON_KEY= 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ0eXprZHVpY2FueG9wb3RmY3dzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk5NzY4MzcsImV4cCI6MjEwNTU1MjgzN30.KbBP79ho6jzlRCeOBSqNEv8Vu8SxNpEAQ9cSEPzjnQw';
const MAX_PAYLOAD = 256 * 1024;          // documented Supabase broadcast limit
const ID_RE      = /^[A-Za-z0-9_-]{1,64}$/;

/* ═══════════ CORE (pure, mirrors test/run.mjs) ═══════════ */
const Core = {
  validId: (id) => typeof id === 'string' && ID_RE.test(id),

  sanitizeName(raw) {
    if (typeof raw !== 'string') return 'PC-??';
    // eslint-disable-next-line no-control-regex
    const clean = raw.replace(/[\x00-\x1F\x7F]/g, '').trim().slice(0, 24);
    return clean || 'PC-??';
  },

  detect(code) {
    if (/^\s*(#include|int main\(|std::|cout\s*<<)/m.test(code)) return 'cpp';
    if (/^\s*(def |import |from \w+ import|class \w+:|print\()/m.test(code)) return 'python';
    if (/^\s*(public class |public static void main|System\.out\.println)/m.test(code)) return 'java';
    if (/^\s*(fn main\(\)|use std::|let mut |println!\(\))/m.test(code)) return 'rust';
    if (/^\s*(package main|func main\(|:=)/m.test(code)) return 'go';
    if (/^\s*(SELECT |INSERT INTO|CREATE TABLE|UPDATE |DELETE FROM)/im.test(code)) return 'sql';
    if (/^\s*(<(!DOCTYPE|html|div|head|body|script))/i.test(code)) return 'html';
    if (/^\s*([.#][\w-]+\s*\{|@media|:root)/m.test(code)) return 'css';
    if (/^\s*(#!\/bin\/bash|echo |sudo |apt-get|chmod)/m.test(code)) return 'bash';
    // JSON BEFORE the generic C-family rules, and tolerate trailing whitespace/newlines.
    if (/^\s*[{[][\s\S]*[}\]]\s*;?\s*$/.test(code.trim()) && /":/.test(code)) return 'json';
    if (/^\s*(interface |type |export |namespace |enum )/m.test(code)) return 'typescript';
    if (/^\s*(const |let |var |function |console\.log\(|=>)/m.test(code)) return 'javascript';
    return 'plaintext';
  },

  ext: (lang) => ({ python:'py', cpp:'cpp', c:'c', java:'java', javascript:'js',
    typescript:'ts', rust:'rs', go:'go', sql:'sql', html:'html', css:'css',
    bash:'sh', json:'json' }[lang] || 'txt'),

  filename(title, lang) {
    const e = Core.ext(lang);
    let base = (title || '').trim().replace(/\s+/g, '-').replace(/[^A-Za-z0-9._-]/g, '');
    if (!base) return 'nirmaan.' + e;
    if (base.toLowerCase().endsWith('.' + e)) return base;
    return base.replace(/\.[^.]*$/, '') + '.' + e;
  },

  backoff(attempt, cap = 30000) {
    const full = Math.min(1000 * 2 ** Math.max(0, attempt - 1), cap);
    return Math.floor(full / 2 + Math.random() * (full / 2)); // jittered
  },

  roomSlug(raw) {
    const h = String(raw || '').replace(/^#/, '').replace(/^room-/, '');
    return h.toLowerCase().replace(/[^a-z0-9_-]/g, '').slice(0, 40) || 'lab-01';
  }
};

/* ═══════════ STATE ═══════════ */
const S = {
  room: 'lab-01',
  nodeId: 'ws_' + Math.random().toString(36).slice(2, 11),
  nodeName: 'PC-' + String(Math.floor(Math.random() * 90) + 10),
  mode: 'text',
  light: false,
  mode_name: 'supabase',
  channel: null,
  mesh: null,
  attempt: 0,
  peers: new Map(),
  msgs: new Map(),
  missed: 0,
  connectedAt: 0,
  sent: [],
  lastToast: 0
};

/* ═══════════ TRANSPORT ═══════════ */
function disconnect() {
  if (S.channel) { try { S.channel.unsubscribe(); } catch {} S.channel = null; }
  if (S.mesh)     { try { S.mesh.close(); } catch {} S.mesh = null; }
}

function setStatus(kind, text) {
  const led = document.getElementById('led');
  led.className = 'led ' + kind;
  document.getElementById('status').textContent = text;
}

function onPayload(p) {
  if (!p || !Core.validId(p.id)) { console.warn('rejected payload', p); return; }
  if (p.senderId === S.nodeId) return;                 // ignore our own echo
  if (p.senderId && S.peers.has(p.senderId) && S.mode_name === 'supabase') S.missed++;
  renderRemote(p);
}

function connect() {
  disconnect();
  setStatus('busy', 'connecting');
  try {
    const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY,
      { realtime: { params: { eventsPerSecond: 10 } } });
    const ch = client.channel('nirmaan-' + S.room, {
      config: { broadcast: { self: false }, presence: { key: S.nodeId } }
    });

    ch.on('broadcast', { event: 'msg' },      ({ payload }) => onPayload(payload));
    ch.on('broadcast', { event: 'edit' },     ({ payload }) => { const m = S.msgs.get(payload?.id); if (m && payload.senderId === m.senderId) patch(m, payload); });
    ch.on('broadcast', { event: 'del' },      ({ payload }) => { const m = S.msgs.get(payload?.id); if (m && payload.senderId === m.senderId) tombstone(m, payload); });
    ch.on('presence',  { event: 'sync' },     ()  => syncPresence(ch));
    ch.on('presence',  { event: 'join' },     ({ newPresences }) => addPeers(newPresences));
    ch.on('presence',  { event: 'leave' },    ({ leftPresences }) => removePeers(leftPresences));

    ch.subscribe((status) => {
      if (status === 'SUBSCRIBED') {
        S.attempt = 0; S.mode_name = 'supabase'; S.connectedAt = Date.now(); S.missed = 0;
        setStatus('live', 'live');
        ch.track({ id: S.nodeId, name: S.nodeName, since: Date.now() });
        // Replay anything sent while we were disconnected — the only recovery available
        // without a server. Bounded so a long outage cannot flood the room.
        S.sent.slice(-25).forEach(m => send('msg', m, true));
      } else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT' || status === 'CLOSED') {
        S.attempt++;
        setStatus('dead', 'reconnecting in ' + Math.round(Core.backoff(S.attempt) / 1000) + 's');
        setTimeout(connect, Core.backoff(S.attempt));
      }
    });
    S.channel = ch;
  } catch (err) {
    console.warn(err);
    startMesh();
  }
}

function send(event, payload, isReplay = false) {
  const bytes = new TextEncoder().encode(JSON.stringify(payload)).length;
  if (bytes > MAX_PAYLOAD) { toast('Too large to send (' + Math.round(bytes / 1024) + 'KB, max 256KB)', true); return false; }
  if (S.channel && S.mode_name === 'supabase') {
    S.channel.send({ type: 'broadcast', event, payload }).catch(() => {});
  } else if (S.mesh) {
    S.mesh.postMessage({ event, payload });
  }
  return true;
}

/* ── Local Mesh: same-browser tabs, no network ── */
function startMesh() {
  S.mode_name = 'mesh';
  setStatus('live', 'local mesh');
  const bc = new BroadcastChannel('nirmaan-' + S.room);
  bc.onmessage = ({ data }) => {
    if (!data) return;
    if (data.event === 'msg') onPayload(data.payload);
    else if (data.event === 'edit') { const m = S.msgs.get(data.payload?.id); if (m && data.payload.senderId === m.senderId) patch(m, data.payload); }
    else if (data.event === 'del')  { const m = S.msgs.get(data.payload?.id); if (m && data.payload.senderId === m.senderId) tombstone(m, data.payload); }
    else if (data.event === 'hi')    { addPeers([data.node]); bc.postMessage({ event: 'yo', node: self() }); }
    else if (data.event === 'yo')    addPeers([data.node]);
    else if (data.event === 'bye')   { S.peers.delete(data.id); paintPeers(); }
  };
  const self = () => ({ id: S.nodeId, name: S.nodeName });
  bc.postMessage({ event: 'hi', node: self() });
  S.peers.set(S.nodeId, { id: S.nodeId, name: S.nodeName });
  S.mesh = bc;
  addEventListener('beforeunload', () => bc.postMessage({ event: 'bye', id: S.nodeId }));
  paintPeers();
}

function syncPresence(ch) {
  S.peers.clear();
  Object.values(ch.presenceState()).forEach(list => list.forEach(addPeers));
}
function addPeers(list) {
  (list || []).forEach(p => { if (p && p.id !== S.nodeId) S.peers.set(p.id, p); });
  S.peers.set(S.nodeId, { id: S.nodeId, name: S.nodeName });
  paintPeers();
}
function removePeers(list) {
  (list || []).forEach(p => S.peers.delete(p.key || p.id));
  paintPeers();
}
function paintPeers() {
  document.getElementById('peer-count').textContent = String(S.peers.size || 1);
  document.getElementById('peer-count').parentElement.setAttribute('aria-label', S.peers.size + ' workstations active');
}

/* ═══════════ RENDER — textContent only, no innerHTML with peer data ═══════════ */
const feed = document.getElementById('feed');
const empty = document.getElementById('empty');
const stick = () => feed.scrollTop = feed.scrollHeight;

function hid() {
  empty.style.display = 'none';
}

function card(m, self) {
  const el = document.createElement('article');
  el.className = 'rounded-xl border border-nk-line/60 bg-nk-surface overflow-hidden';
  el.dataset.id = m.id;                       // dataset, never an attribute string built from peer data

  const head = document.createElement('div');
  head.className = 'flex items-center gap-2 px-3 py-2 border-b border-nk-line/50 bg-nk-bg/40 flex-wrap';

  const who = document.createElement('span');
  who.className = 'mono text-xs font-bold tracking-wide';
  who.textContent = m.senderName;             // SAFE
  head.append(who);

  if (self) { const you = document.createElement('span');
    you.className = 'mono text-[9px] uppercase tracking-widest px-1.5 py-0.5 rounded border border-nk-line';
    you.textContent = 'you'; head.append(you); }

  if (m.edited) { const b = document.createElement('span');
    b.className = 'mono text-[9px] uppercase tracking-widest px-1.5 py-0.5 rounded border border-nk-line text-nk-dim';
    b.textContent = 'edited'; head.append(b); }

  const t = document.createElement('span');
  t.className = 'mono text-[10px] text-nk-dim ml-auto';
  t.textContent = new Date(m.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  head.append(t);

  if (self) {
    const eb = mkBtn('edit', 'Edit');
    eb.dataset.act = 'edit';
    const db = mkBtn('del', 'Delete');
    db.dataset.act = 'del';
    head.append(eb, db);
  }

  el.append(head);
  el.append(m.type === 'code' ? codeBody(m) : textBody(m));
  return el;
}

function mkBtn(act, label) {
  const b = document.createElement('button');
  b.type = 'button'; b.dataset.act = act;
  b.className = 'mono text-[10px] uppercase tracking-wider px-2 py-0.5 rounded border border-nk-line/60 hover:bg-nk-muted transition-colors';
  b.textContent = label;
  return b;
}

function textBody(m) {
  const d = document.createElement('div');
  d.className = 'prose text-sm leading-relaxed p-3 whitespace-pre-wrap break-words';
  d.textContent = m.content;                 // SAFE
  return d;
}

function codeBody(m) {
  const wrap = document.createElement('div');

  const bar = document.createElement('div');
  bar.className = 'flex items-center gap-2 px-3 py-2 border-b border-nk-line/50 bg-nk-bg/40';

  const lang = document.createElement('span');
  lang.className = 'mono text-[9px] font-bold uppercase tracking-widest px-1.5 py-0.5 rounded bg-nk-muted';
  lang.textContent = (m.language || 'text').toUpperCase();

  const name = document.createElement('span');
  name.className = 'mono text-xs font-bold truncate';
  name.textContent = m.title || '';

  const size = document.createElement('span');
  size.className = 'mono text-[10px] text-nk-dim';
  size.textContent = m.content.split('\n').length + 'L';

  const copy = mkBtn('copy', 'Copy');   copy.dataset.act = 'copy';
  const save = mkBtn('save', 'Save');   save.dataset.act = 'save';
  save.className += ' bg-nk-live text-nk-bg border-nk-live hover:brightness-110';

  bar.append(lang, name, size);
  const sp = document.createElement('span'); sp.className = 'flex-1'; bar.append(sp);
  bar.append(copy, save);
  wrap.append(bar);

  const well = document.createElement('div');
  well.className = 'hl flex overflow-x-auto';

  const nums = document.createElement('div');
  nums.className = 'ln py-3';
  const total = m.content.split('\n').length;
  for (let i = 1; i <= total; i++) {
    const ln = document.createElement('div');
    ln.textContent = String(i);
    nums.append(ln);
  }

  const pre = document.createElement('pre');
  pre.className = 'm-0 p-3 overflow-visible';
  const code = document.createElement('code');
  code.className = 'mono block hljs language-' + (m.language || 'plaintext');
  code.textContent = m.content;            // SAFE — no innerHTML, no peer markup
  pre.append(code);
  well.append(nums, pre);
  wrap.append(well);

  if (window.hljs) { try { hljs.highlightElement(code); } catch {} }
  return wrap;
}

function tombstone(m) {
  m.removed = true;
  const el = feed.querySelector('[data-id="' + CSS.escape(m.id) + '"]');
  if (!el) return;
  const t = document.createElement('div');
  t.className = 'mono text-xs text-nk-dim p-3 italic';
  t.textContent = '— ' + m.senderName + ' removed this transmission —';
  el.replaceChildren();
  el.append(t);
}

function patch(m, p) {
  m.content = typeof p.content === 'string' ? p.content : m.content;
  if (m.type === 'code') { m.title = p.title || m.title; m.language = p.language || m.language; }
  m.edited = true;
  const el = feed.querySelector('[data-id="' + CSS.escape(m.id) + '"]');
  if (el) el.replaceWith(card(m, m.senderId === S.nodeId));
}

function renderRemote(p) {
  if (S.msgs.has(p.id)) return;               // duplicate guard
  const m = {
    id: p.id, type: p.type === 'code' ? 'code' : 'text',
    senderId: p.senderId || '', senderName: Core.sanitizeName(p.senderName),
    timestamp: typeof p.timestamp === 'number' ? p.timestamp : Date.now(),
    content: typeof p.content === 'string' ? p.content : '',
    language: p.language, title: p.title, edited: false, removed: false
  };
  S.msgs.set(m.id, m);
  feed.append(card(m, m.senderId === S.nodeId));
  hid(); stick();
}

/* ═══════════ COMPOSER ═══════════ */
const form = document.getElementById('composer');
const input = document.getElementById('composer-input');
const langSel = document.getElementById('code-lang');
const titleIn = document.getElementById('code-title');

function setMode(mode) {
  S.mode = mode;
  document.querySelectorAll('.mode-btn').forEach(b => {
    const on = b.dataset.mode === mode;
    b.setAttribute('aria-selected', String(on));
    b.className = 'mode-btn mono text-[11px] uppercase tracking-wider px-3 py-1 rounded-md transition-colors ' +
      (on ? 'bg-nk-live text-nk-bg' : 'text-nk-dim hover:text-nk-fg');
  });
  const opts = document.getElementById('code-opts');
  opts.classList.toggle('hidden', mode !== 'code');
  opts.classList.toggle('flex', mode === 'code');
  input.placeholder = mode === 'code' ? 'Paste code, then ctrl+enter…' : 'Broadcast a message…';
  input.focus();
}

form.addEventListener('submit', (e) => { e.preventDefault(); transmit(); });

function transmit() {
  const raw = input.value;
  if (!raw.trim()) return;

  const m = {
    id: 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
    type: S.mode === 'code' ? 'code' : 'text',
    senderId: S.nodeId,
    senderName: S.nodeName,
    timestamp: Date.now(),
    content: raw
  };
  if (m.type === 'code') {
    m.language = langSel.value === 'auto' ? Core.detect(raw) : langSel.value;
    m.title = Core.filename(titleIn.value.trim(), m.language);
  }

  if (!send('msg', m)) { toast('Message too large', true); return; }
  S.msgs.set(m.id, m);
  S.sent.push(m);
  if (S.sent.length > 60) S.sent.shift();

  feed.append(card(m, true));
  hid(); stick();
  input.value = ''; input.style.height = 'auto';
  if (m.type === 'code') titleIn.value = '';
}

input.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); transmit(); return; }
  if (e.key === 'Tab') {                              // 2-space indent, focus preserved
    e.preventDefault();
    const a = input.selectionStart, b = input.selectionEnd;
    if (e.shiftKey) {
      const before = input.value.slice(0, a);
      const ls = before.lastIndexOf('\n') + 1;
      if (input.value.slice(ls, ls + 2) === '  ') input.setRangeText('', ls, ls + 2, 'end');
    } else {
      input.setRangeText('  ', a, b, 'end');
    }
  }
});
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 192) + 'px';
});

/* ═══════════ DELEGATED EVENTS — zero inline handlers ══════════ */
document.addEventListener('click', async (e) => {
  const btn = e.target.closest('[data-action],[data-act]');
  if (!btn) return;
  const act = btn.dataset.action || btn.dataset.act;

  if (act === 'mode')  { setMode(btn.dataset.mode); return; }
  if (act === 'toggle-theme') {
    S.light = !S.light;
    document.documentElement.classList.toggle('light', S.light);
    document.body.classList.toggle('bg-white', S.light);
    document.body.classList.toggle('text-nk-bg', S.light);
    toast(S.light ? 'Light mode' : 'Dark mode');
    return;
  }
  if (act === 'copy-link') {
    const link = location.origin + location.pathname + '#' + S.room;
    try { await navigator.clipboard.writeText(link); toast('Room link copied'); }
    catch { toast(link); }
    return;
  }

  const el = btn.closest('[data-id]');
  if (!el) return;
  const id = el.dataset.id;
  const m = S.msgs.get(id);
  if (!m) return;

  if (act === 'copy') {
    try { await navigator.clipboard.writeText(m.content); toast('Copied'); }
    catch { toast('Copy blocked by browser'); }
  } else if (act === 'save') {
    const blob = new Blob([m.content], { type: 'text/plain;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = m.title || Core.filename('', m.language);
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    toast('Saved ' + a.download);
  } else if (act === 'del') {
    if (btn.dataset.confirm) {
      send('del', { id, senderId: S.nodeId, timestamp: Date.now() });
      tombstone(m);
    } else {
      btn.dataset.confirm = '1'; btn.textContent = 'Sure?';
      setTimeout(() => { delete btn.dataset.confirm; btn.textContent = 'Delete'; }, 3000);
    }
  } else if (act === 'edit') {
    const next = prompt('Edit transmission', m.content);
    if (next && next !== m.content) {
      send('edit', { id, senderId: S.nodeId, content: next, type: m.type,
                     title: m.title, language: m.language, editedAt: Date.now() });
      patch(m, { content: next });
    }
  }
});

document.getElementById('node-name').addEventListener('change', (e) => {
  S.nodeName = Core.sanitizeName(e.target.value);
  e.target.value = S.nodeName;
  S.peers.set(S.nodeId, { id: S.nodeId, name: S.nodeName });
  paintPeers();
  if (S.channel) S.channel.track({ id: S.nodeId, name: S.nodeName, since: Date.now() });
});

addEventListener('hashchange', () => {
  const next = Core.roomSlug(location.hash);
  if (next !== S.room) { S.room = next; S.msgs.clear(); feed.replaceChildren(empty); empty.style.display = ''; document.getElementById('room-label').textContent = next; connect(); }
});

/* ═══════════ TOAST ═══════════ */
function toast(msg, bad) {
  const now = Date.now();
  if (now - S.lastToast < 350 && bad) return;
  S.lastToast = now;
  const t = document.createElement('div');
  t.className = 'mono text-xs px-3 py-2 rounded-lg border bg-nk-raised shadow-lg ' +
    (bad ? 'border-nk-bad text-nk-bad' : 'border-nk-line');
  t.textContent = msg;
  document.getElementById('toasts').append(t);
  setTimeout(() => t.remove(), 2600);
}

/* ═══════════ BOOT ═══════════ */
function boot() {
  S.room = Core.roomSlug(location.hash);
  document.getElementById('room-label').textContent = S.room;
  document.getElementById('node-name').value = S.nodeName;
  document.getElementById('peer-count').parentElement.setAttribute('aria-label', '1 workstation active');
  setMode('text');
  paintPeers();
  if (window.supabase) connect();
  else { startMesh(); toast('CDN blocked — local mesh only', true); }
  setInterval(() => {
    const down = Date.now() - S.connectedAt;
    if (S.missed > 0 && down > 0) { toast('Reconnected — ' + S.missed + ' missed'); S.missed = 0; }
  }, 4000);
}
document.addEventListener('DOMContentLoaded', boot);
</script>
</body>
</html>
